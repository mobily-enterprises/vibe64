<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Node</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #172b3a; background: #f3f7fa; }
    body { margin: 0; padding: 32px 20px; }
    main { max-width: 640px; margin: 10vh auto; padding: 32px; background: white; border-radius: 20px; }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 12px 0; }
    p { line-height: 1.6; }
    button { background: #176bc0; color: white; border: 0; border-radius: 8px; padding: 12px 20px; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #172b3a; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p>Vibe64 example project</p>
    <h1>Hello, Node.</h1>
    <p>A small app to explore, edit, and run. No dependencies, database, or accounts needed.</p>
    <p>Edit this page in Files, then refresh Preview to see your change.</p>
    <button type="button" id="counter">Clicked 0 times</button>
    <p>Your clicks stay in this tab and reset when you reload.</p>
  </main>
  <script>
    let clicks = 0;
    document.querySelector('#counter').addEventListener('click', (event) => {
      clicks += 1;
      event.currentTarget.textContent = `Clicked ${clicks} ${clicks === 1 ? 'time' : 'times'}`;
    });
  </script>
</body>
</html>
