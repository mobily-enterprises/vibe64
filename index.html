<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vibe64</title>
    <script>
      // This must run before the module graph, whose download failures never reach main.js.
      window.addEventListener("error", (event) => {
        if (!(event.target instanceof HTMLScriptElement) || event.target.type !== "module") return;
        const showFailure = () => {
          const status = document.getElementById("startup-status");
          if (status) status.textContent = "Vibe64 could not open. Reload the page to try again.";
        };
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", showFailure, { once: true });
        } else {
          showFailure();
        }
      }, true);
    </script>
    <style>
      #startup-shell { position: fixed; inset: 0; display: grid; grid-template-rows: 56px 1fr; background: #faf9fc; color: #25232a; font: 15px system-ui, sans-serif; }
      #startup-shell header { display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid #dedce3; font-weight: 600; }
      #startup-shell main { display: grid; grid-template-columns: 240px 1fr; min-height: 0; }
      #startup-shell aside { border-right: 1px solid #dedce3; padding: 24px; }
      #startup-shell .startup-placeholder { height: 16px; margin-bottom: 20px; border-radius: 4px; background: #e5e2eb; }
      #startup-shell section { padding: 32px; }
      #startup-shell a { display: inline-flex; align-items: center; min-height: 48px; color: inherit; }
      @media (max-width: 600px) { #startup-shell main { grid-template-columns: 1fr; } #startup-shell aside { display: none; } }
      @media (prefers-color-scheme: dark) { #startup-shell { background: #19181d; color: #eeeaf3; } #startup-shell header, #startup-shell aside { border-color: #3c3942; } #startup-shell .startup-placeholder { background: #35323d; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="startup-shell">
        <header>Vibe64</header>
        <main>
          <aside aria-hidden="true">
            <div class="startup-placeholder"></div>
            <div class="startup-placeholder"></div>
            <div class="startup-placeholder"></div>
          </aside>
          <section>
            <p id="startup-status" role="status" aria-live="polite">Loading Vibe64…</p>
            <noscript>JavaScript must be enabled to open Vibe64.</noscript>
            <a href="">Reload page</a>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
